# configs/earthformer.yaml
# EarthFormer (Gao et al., NeurIPS 2022) adapted for calving front SDT prediction.

data:
  splits_dir:    "/path/to/calvdb/TrainingDataset_processed/splits"
  stats_path:    "/path/to/calvdb/TrainingDataset_processed/splits/normalisation_stats.json"
  modalities:    ["sdt", "imagery", "geophys", "climate"]
  batch_size:    2
  num_workers:   4
  pin_memory:    true
  augment_train: true

model:
  name:          "CalvingEarthFormer"
  base_channels: 64            # transformer embedding dimension E
  K:             5             # number of input time steps
  C_total:       12            # 1 SDT + 1 SDT_diff + 5 imagery + 5 geophys
  climate_dim:   10            # K × D_c = 5 × 2
  tau_dim:       20            # K × 4   = 5 × 4
  num_layers:    4             # stacked EarthFormer blocks
  num_heads:     4             # attention heads (base_channels must be divisible)
  window_size:   [5, 2, 2]    # cuboid (Tw, Hw, Ww); Tw clamped to K at runtime
  mlp_ratio:     4.0           # FFN hidden / embed ratio
  drop:          0.0           # MLP / projection dropout
  attn_drop:     0.0           # attention-weight dropout

loss:
  decay_pixels: 10.0  # exponential decay in pixels; 10px × 30m = 300m half-power
  min_weight:   0.0   # weight floor for far-field pixels

prediction:
  mode:              "displacement"     # model predicts SDT change, not absolute SDT
  displacement_from: "t_minus_30"       # anchor index 4 — most recent input
  reconstruction:    "add_last_input"   # pred_abs = pred_disp + last_input_sdt
  trend_as_input:    false              # intentionally excluded for transferability

optimiser:
  name:          "AdamW"
  lr:            1.0e-4
  weight_decay:  1.0e-3
  betas:         [0.9, 0.999]

scheduler:
  name:          "CosineAnnealingLR"
  T_max:         200            # epochs
  eta_min:       1.0e-6

training:
  n_epochs:      200
  val_every:     5
  save_every:    10
  early_stopping_patience: 30  # 30 val evals × 5 = 150 epochs max
  grad_clip_norm: 1.0
  mixed_precision: true

paths:
  checkpoint_dir: "experiments/exp21_earthformer/checkpoints/"
  log_dir:        "experiments/exp21_earthformer/logs/"

wandb:
  enabled:  true
  project:  "calvingdb"
  entity:   null
  run_name: "earthformer-exp21"
  tags:     ["earthformer-exp21"]
  notes:    "tau/climate per-timestep injection + sdt_diff + decay_pixels=10 + augment v+h flip"
